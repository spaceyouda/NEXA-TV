name: Build Nexa TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nexatv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NexaTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nexatv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexatv'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Nexa TV"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#0b0f14</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/web"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>

          </FrameLayout>
          EOF

          cat > app/src/main/java/com/nexatv/MainActivity.java <<'EOF'
          package com.nexatv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  WebView web = findViewById(R.id.web);

                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setMediaPlaybackRequiresUserGesture(false);

                  web.setWebViewClient(new WebViewClient());

                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Nexa TV</title>

          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#0b0f14;color:#fff;font-family:Arial}
          header{padding:18px 14px;background:#0b0f14}
          h2{margin:0 0 12px}
          .tabs{display:flex;gap:7px}
          button,select,input{border:1px solid #293543;background:#151d27;color:#fff;border-radius:11px;padding:11px}
          button{flex:1}
          .search,select{width:100%;margin-top:9px}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px}
          .card{background:#131b24;border:1px solid #202b38;border-radius:13px;padding:10px}
          .play{width:100%;margin-top:8px}
          .hidden{display:none}
          #status{padding:0 14px;color:#8f9baa;font-size:12px}
          </style>
          </head>

          <body>

          <header>
          <h2>📺 Nexa TV</h2>

          <div class="tabs">
          <button id="fa" onclick="setMode('fa')">🇮🇷 فارسی</button>
          <button id="all" onclick="setMode('all')">🌍 همه کشورها</button>
          <button id="adult" onclick="setMode('adult')">🔞 +18</button>
          </div>

          <select id="country" class="hidden"></select>

          <input
          id="q"
          class="search"
          placeholder="جستجوی کانال..."
          oninput="render()">

          </header>

          <div id="status">در حال آماده‌سازی...</div>
          <main id="list" class="grid"></main>

          <script>

          const BASE = "https://iptv-org.github.io";
          const NEXA = "https://raw.githubusercontent.com/itsyebekhe/nexa/main/playlist.m3u";

          let mode = "fa";
          let channels = [];
          let countries = [];

          function status(text) {
              document.getElementById("status").textContent = text;
          }

          async function getText(url) {
              const response = await fetch(url);

              if (!response.ok) {
                  throw new Error(response.status);
              }

              return response.text();
          }

          function parsePlaylist(text) {

              const result = [];
              let info = null;

              for (const line of text.split(/\r?\n/)) {

                  if (line.startsWith("#EXTINF:")) {
                      info = line;
                  }

                  else if (info && line && !line.startsWith("#")) {

                      const match = info.match(/,(.*)$/);

                      result.push({
                          name: match ? match[1] : "Channel",
                          url: line.trim()
                      });

                      info = null;
                  }
              }

              return result;
          }

          function setMode(newMode) {

              mode = newMode;

              document
                  .querySelectorAll(".tabs button")
                  .forEach(button => button.classList.remove("active"));

              document.getElementById(mode).classList.add("active");

              document
                  .getElementById("country")
                  .classList.toggle("hidden", mode !== "all");

              loadChannels();
          }

          async function loadChannels() {

              try {

                  status("در حال دریافت...");

                  if (mode === "fa") {

                      channels = parsePlaylist(await getText(NEXA));

                  }

                  else if (mode === "all") {

                      const country =
                          document.getElementById("country").value;

                      if (!country) {

                          channels = [];
                          render();
                          status("کشور را انتخاب کنید");
                          return;
                      }

                      channels = parsePlaylist(
                          await getText(
                              BASE +
                              "/iptv/countries/" +
                              country.toLowerCase() +
                              ".m3u"
                          )
                      );
                  }

                  else {

                      const channelData =
                          await fetch(
                              BASE + "/api/channels.json"
                          ).then(response => response.json());

                      const streamData =
                          await fetch(
                              BASE + "/api/streams.json"
                          ).then(response => response.json());

                      const ids = new Set(
                          channelData
                              .filter(channel => channel.is_nsfw)
                              .map(channel => channel.id)
                      );

                      channels = streamData
                          .filter(stream =>
                              ids.has(stream.channel) &&
                              stream.url
                          )
                          .map(stream => ({
                              name: stream.title || stream.channel,
                              url: stream.url
                          }));
                  }

                  status(channels.length + " کانال");

                  render();

              } catch (error) {

                  status("خطا: " + error.message);

              }
          }

          async function init() {

              try {

                  countries =
                      await fetch(
                          BASE + "/api/countries.json"
                      ).then(response => response.json());

                  const select =
                      document.getElementById("country");

                  select.innerHTML =
                      '<option value="">کشور را انتخاب کنید</option>' +
                      countries
                          .sort((a,b) =>
                              a.name.localeCompare(b.name)
                          )
                          .map(country =>
                              '<option value="' +
                              country.code +
                              '">' +
                              (country.flag || "") +
                              " " +
                              country.name +
                              "</option>"
                          )
                          .join("");

                  select.onchange = loadChannels;

                  document
                      .getElementById("fa")
                      .classList.add("active");

                  loadChannels();

              } catch (error) {

                  status("خطا: " + error.message);

              }
          }

          function render() {

              const query =
                  document
                      .getElementById("q")
                      .value
                      .toLowerCase();

              const list =
                  document.getElementById("list");

              const filtered =
                  channels
                      .filter(channel =>
                          !query ||
                          channel.name
                              .toLowerCase()
                              .includes(query)
                      )
                      .slice(0,500);

              list.innerHTML =
                  filtered.map(channel => {

                      const safeName =
                          channel.name.replace(/[<>]/g,"");

                      const safeUrl =
                          channel.url.replace(/'/g,"%27");

                      return (
                          '<div class="card">' +
                          '<b>' + safeName + '</b>' +
                          '<button class="play" ' +
                          'onclick="playChannel(\'' +
                          safeUrl +
                          '\')">' +
                          '▶ پخش' +
                          '</button>' +
                          '</div>'
                      );

                  }).join("");

              if (!filtered.length) {

                  list.innerHTML =
                      '<p style="grid-column:1/-1;text-align:center">' +
                      'کانالی پیدا نشد' +
                      '</p>';
              }
          }

          function playChannel(url) {
              location.href = url;
          }

          init();

          </script>

          </body>
          </html>
          EOF

      - name: Build APK
        run: |
          gradle --version
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
