          <header>
          <h2>📺 Nexa TV</h2>

          <div class="tabs">
          <button id="fa" onclick="mode='fa';go()">🇮🇷 فارسی</button>
          <button id="all" onclick="mode='all';go()">🌍 همه کشورها</button>
          <button id="adult" onclick="mode='adult';go()">🔞 +18</button>
